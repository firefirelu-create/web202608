<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卷軸效果</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <!-- 保留原本的外部 CSS -->
    <link rel="stylesheet" href="../css/public board-1.css">

    <style>
        .box01 {
            height: 100px;
            background-color: azure;
        }

        .roller-r {
            position: relative;
           
        }
<!--跑版2秒-->
        .roller-r .roller-box-r {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0,0,0,0.3);
            transform: translateX(100%);
            transition: transform 2s;
            display: flex;
            justify-content: center ;
            align-items: center;
        }

        .roller-r:hover .roller-box-r {
            transform: translateX(0%);
        }

        .roller-l {
            position: relative;
           
        }
<!--跑版2秒-->
        .roller-l .roller-box-l {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0,0,0,0.3);
            transform: translateX(100%);
            transition: transform 2s;
            display: flex;
            justify-content: center ;
            align-items: center;
        }

        .roller-l:hover .roller-box-l {
            transform: translateX(0%);
        }
        
    </style>
<!--.row>.col-sm-6.col-md.col-lg-3.col-x1-6.col-xxl-1.mt-3*24>.box.bg-primary-->

<!--sm=576/md=768/lg=992/xl=1200/xxl=1400-->
</head>
<body>
    <div class="container my-5">
        <div class="row mt-3">
            <h1>從左邊到右邊</h1>
            
            <div class="col-4 roller-r bg-info">
                <div class="roller-box-r ">
                    <button class="btn btn-outline-success">了解更多</button>
                </div>
                <div class="box01"></div>
            </div>
        </div>

        <div class="row mt-3">
            <h1>從左邊到右邊</h1>
            
            <div class="col-4 roller-l bg-info">
                <div class="roller-box-l ">
                    <button class="btn btn-success">了解更多</button>
                </div>
                <div class="box01"></div>
            </div>
        </div>


        <h1>從上到下t-y</h1>
        <h1>從下到上b-y</h1>
    </div>
    
    <!-- Bootstrap JS：保留原本設定 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery：若其他程式有使用，仍可保留 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</body>

</html>
