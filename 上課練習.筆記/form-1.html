<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch8.forms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <!-- 保留原本的外部 CSS -->
    <link rel="stylesheet" href="../css/public board-1.css">

</head>
<body class="bg-light">
    <div class="container" my-5>
        <div class="display-2 fw-900 text-center   text-bg-warning py-3 my-3">ch8.forms 表單</div>

        <div class="h1 fw-900 text-primary">1.基本表單</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="username" class="form-label">姓名</label>
                    <input type="text" class="form-control form-control-lg" id="username" placeholder="請填入姓名,1~6個字數。">        
                </div>
            </div>

            <div class="col-12">
                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control form-control-lg" id="password" placeholder="請填入密碼,1~8個字數。">        
                </div>
            </div>

            <div class="col-12">
                <div class="mb-3">
                    <label for="email" class="form-label">email</label>
                    <input type="email" class="form-control form-control-sm" id="email">        
                </div>
            </div>

            <div class="col-12">
                <div class="mb-3">
                    <label for="number" class="form-label">number</label>
                    <input type="number" class="form-control" id="number" min="0" max="100" value="50" step="1">        
                </div>
            </div>

             <div class="col-12">
                <div class="mb-3">
                    <label for="myfile" class="form-label">檔案</label>
                    <input type="file" class="form-control form-control-sm" id="myfile">        
                </div>
            </div>
        </div>

         <div class="h1 fw-900 text-primary">2.datalist</div>
         <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="exampleDatalists" class="form-label">選擇單點</label>
                    <input type="text" class="form-control form-control-lg" id="exampleDatalists" list="dataListOpotion">
                    <datalist id="dataListOpotion">
                        <option value="漢堡"></option>
                        <option value="薯條"></option>
                        <option value="雞塊"></option>
                        <option value="咖啡"></option>
                    </datalist>
                </div>
            </div>
         </div>
       
         <div class="h1 fw-900 text-primary" >3.select 下拉選單</div>
         <div class="row">
            <div class="col-12">
                <label for="myselect" class="form-label">選擇餐點方案</label>
                <select name="" id="myselect" class="form-select form-select-sm" >
                    <option value="方案一">方案一</option>
                    <option value="方案二">方案二</option>
                    <option value="方案三">方案三</option>
                </select>
            </div>
         </div>

         <div class="row">
            <div class="col-12">               
                <select name="" id="" class="form-select form-select-sm mt-4" >
                    <option value="" class="text-center" disabled selected>---請選縣巿名稱---</option>
                    <option value="臺北巿">臺北巿</option>
                    <option value="臺中巿">臺中巿</option>
                    <option value="臺南巿">臺南巿</option>
                </select>
            </div>
         </div>

         <div class="h1 fw-900 text-primary" >4.checkbox</div>
         <div class="row">
            <div class="col-12">
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" id="chk01">
                    <label for="chk01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="checkbox" class="form-check-input" id="chk02">
                    <label for="chk02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check ">
                    <input type="checkbox" class="form-check-input" id="chk03">
                    <label for="chk03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check ">
                    <input type="checkbox" class="form-check-input" id="chk04">
                    <label for="chk04" class="form-check-label">選項04</label>
                </div>
            </div>
         </div>

         

         <div class="h1 fw-900 text-primary" >5.radio</div>
         <div class="row">
            <div class="col-12">
                <div class="form-check ">
                    <input type="radio" class="form-check-input" id="radio01" name="myradio">
                    <label for="radio01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" id="radio02" name="myradio">
                    <label for="radio02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check ">
                    <input type="radio" class="form-check-input" id="radio03" >
                    <label for="radio03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check ">
                    <input type="radio" class="form-check-input" id="radio04" name="myradio">
                    <label for="radio04" class="form-check-label">選項04</label>
                </div>
            </div>
         </div>

         <div class="h1 fw-900 text-primary" >6.switch</div>
         <div class="row">
            <div class="col-12">
         <div class="form-check form-switch">
            <input type="checkbox" name="" id="" class="form-check-input">
            <label for="" class="form-check-label">開/關</label>
         </div>
        </div>
        </div>

        <div class="h1 fw-900 text-primary" >7.range</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="" class="form-label">數量<span class="fs-3 text-success fw-bold">30</span>個</label>
                    <input type="range" name="" id="" class="form-range" min="0" max="100" step="1" value="30">
                    <div class="d-flex justify-content-between">
                        <div class="h2">0</div>
                        <div class="h2">100</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="h3  text-primary" >8.input-group</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-2 input-group input-group-lg">
                     <span class="finput-group-text">姓名</span>
                     <input type="text" class="form-control" placeholder="請填入姓名,1~6個字數。"> 
                </div>

                 <div class="mb-3 input-group input-group-sm">                    
                     <input type="text" class="form-control" placeholder="請填入google帳號。"> 
                     <span class="finput-group-text">@gmail.com</span>
                </div>

                <div class="mb-3 input-group ">
                    <span class="finput-group-text">09</span>                    
                     <input type="text" class="form-control" placeholder="請填入行動電話後8碼。">                      
                </div>  
                
                <div class="mb-3 input-group input-group-lg">                                 
                     <input type="text" class="form-control" placeholder="請填入關鍵字。"> 

                     <button type="button btnline">search</button>

                     
                     
                </div>  
            </div>
        </div>

         <div class="h3  text-primary" >9.floating label</div>
         <div class="row">
            <div class="col-12">
                <div class="mb-3 form-floating">
                <input type="text" class="form-control form-control">
                <label for="" class="form-label">姓名</label>
            </div>

            <div class="mb-3 form-floating">
                <input type="email" class="form-control form-control">
                <label for="" class="form-label">email</label>
            </div>
            </div>
         </div>   
         
         <div class="h3  text-primary" >10.表單驗證</div>
         <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="" class="form-label" >姓名</label>
                    <input type="text" class="form-control is-valid" placeholder="請填入姓名,字數1~6字個。">
                    <div class="valid-feedback">姓名輸入符合規定</div>
                    <div class="invalid-feedback">姓名輸入不符合規定</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control  is-invalid" id="password"             placeholder="請填入密碼,必須包含一個英文大小寫、字數1~6字。"> 
                    <div class="valid-feedback">密碼輸入符合規定</div>
                    <div class="invalid-feedback">密碼輸入不符合規定</div>       
                </div>
            </div>
         </div>
        
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery：若其他程式有使用，仍可保留 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>   
</body>
</html>
